<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pagamento da Formatura</title>

<style>
body {
    font-family: "Segoe UI", Arial, sans-serif;
    background: linear-gradient(120deg, #1e3c72, #2a5298);
    padding: 20px;
}

h1 {
    text-align: center;
    color: white;
}

.table-container {
    background: white;
    padding: 15px;
    border-radius: 12px;
    overflow-x: auto;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

table {
    border-collapse: collapse;
    width: 100%;
    min-width: 1100px;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    font-size: 12px;
}

th {
    background: #2a5298;
    color: white;
}

.nome {
    text-align: left;
    font-weight: bold;
    background: #f2f4f8;
}

/* Botões */
.btn {
    width: 100%;
    padding: 6px;
    border: none;
    border-radius: 20px;
    font-size: 11px;
}

.pago {
    background: #2ecc71;
    color: white;
}

.aberto {
    background: #f1c40f;
    color: black;
    cursor: pointer;
}

.nao-pago {
    background: #e74c3c;
    color: white;
}

.futuro {
    background: #95a5a6;
    color: white;
    cursor: not-allowed;
    opacity: 0.7;
}

.valor {
    display: block;
    font-size: 10px;
}

/* Legenda */
.legend {
    margin-top: 15px;
    display: flex;
    gap: 15px;
    justify-content: center;
    font-size: 13px;
}

.legend span {
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
}

.legend .g { background: #2ecc71; }
.legend .y { background: #f1c40f; color: black; }
.legend .r { background: #e74c3c; }
.legend .b { background: #95a5a6; }
</style>
</head>

<body>

<h1>🎓 Controle de Pagamento da Formatura</h1>

<div class="table-container">
<table>
<tr>
    <th>Aluno</th>
    <th>Jan</th><th>Fev</th><th>Mar</th><th>Abr</th><th>Mai</th>
    <th>Jun</th><th>Jul</th><th>Ago</th><th>Set</th><th>Out</th><th>Nov</th>
</tr>

<script>
const alunos = [
"Ana Lucia","Andre","Antônia","Emilly","Gabriel","Gustavo","Hakelly",
"Helen","Hevilly","Isabella","Jeniffer","João V","Lara","Letícia",
"Luisa","Luismar","Marcos","Maria Neusiane","Ryan","Silvério","Thauanny"
];

const pagosJaneiro = ["Luisa", "Thauanny", "Jeniffer"];
const naoPagouJaneiro = ["Isabella"];

function btnPago() {
    return `<button class="btn pago">Pago<span class="valor">R$ 20</span></button>`;
}

function btnAberto() {
    return `<button class="btn aberto" onclick="pagar(this)">Em aberto<span class="valor">R$ 20</span></button>`;
}

function btnNaoPago() {
    return `<button class="btn nao-pago">Não pago<span class="valor">R$ 20</span></button>`;
}

function btnFuturo() {
    return `<button class="btn futuro">Mês futuro</button>`;
}

alunos.forEach(nome => {
    document.write("<tr>");
    document.write(`<td class="nome">${nome}</td>`);

    // Janeiro
    if (pagosJaneiro.includes(nome)) {
        document.write(`<td>${btnPago()}</td>`);
    } else if (naoPagouJaneiro.includes(nome)) {
        document.write(`<td>${btnNaoPago()}</td>`);
    } else {
        document.write(`<td>${btnAberto()}</td>`);
    }

    // Fevereiro a Novembro
    for (let i = 1; i < 11; i++) {
        document.write(`<td>${btnFuturo()}</td>`);
    }

    document.write("</tr>");
});
</script>

</table>
</div>

<div class="legend">
    <span class="g">Pago</span>
    <span class="y">Janeiro em aberto</span>
    <span class="r">Não pago</span>
    <span class="b">Mês futuro</span>
</div>

<script>
function pagar(botao) {
    botao.className = "btn pago";
    botao.innerHTML = 'Pago<span class="valor">R$ 20</span>';
}
</script>

</body>
</html>
